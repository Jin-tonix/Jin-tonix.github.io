<!doctype html><html lang="ko"><head><script>!function(n){if("/"===n.search[1]){var a=n.search.slice(1).split("&").map((function(n){return n.replace(/~and~/g,"&")})).join("?");window.history.replaceState(null,null,n.pathname.slice(0,-1)+a+n.hash)}}(window.location)</script><meta charset="utf-8"/><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/><link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/><link rel="icon" href="/favicon.ico"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#222222"/><link rel="apple-touch-icon" href="/logo192.png"/><link rel="manifest" href="/manifest.json"/><link href="/static/css/main.284292b9.chunk.css" rel="stylesheet"><title>LightRAG 지식 허브·메일 에이전트 · Jinhee Mok</title><meta name="description" content="에이전트 4곳이 같은 지식 허브에서 근거를 찾고, 메일은 근거 있는 초안만 직원 초안함에 갑니다"/><meta property="og:type" content="article"/><meta property="og:site_name" content="Jinhee Mok · AI Engineer"/><meta property="og:url" content="https://jin-tonix.github.io/projects/email-agent/"/><meta property="og:title" content="LightRAG 지식 허브·메일 에이전트 · Jinhee Mok"/><meta property="og:description" content="에이전트 4곳이 같은 지식 허브에서 근거를 찾고, 메일은 근거 있는 초안만 직원 초안함에 갑니다"/><meta property="og:image" content="https://jin-tonix.github.io/images/v3/diagram-email-agent.png"/><meta property="og:locale" content="ko_KR"/><meta name="twitter:card" content="summary_large_image"/><link rel="canonical" href="https://jin-tonix.github.io/projects/email-agent/"/><link rel="alternate" hreflang="ko" href="https://jin-tonix.github.io/projects/email-agent/"/><link rel="alternate" hreflang="en" href="https://jin-tonix.github.io/en/projects/email-agent/"/><link rel="alternate" hreflang="x-default" href="https://jin-tonix.github.io/projects/email-agent/"/></head><body><noscript><main><h1>LightRAG 지식 허브 · 메일 에이전트</h1><p>에이전트 4곳이 같은 지식 허브에서 근거를 찾고, 메일은 근거 있는 초안만 직원 초안함에 갑니다</p><p>벤더 CS, 인플루언서 CS, Spark, 판매 파트너사 매칭이 LightRAG 지식 허브(워크스페이스 13개) 하나를 같이 씁니다. 질문마다 자료를 먼저 찾아 붙여 답하는 RAG 저장소입니다. 워크스페이스마다 설명·주인·채널·민감도가 붙어 있고, 모르는 워크스페이스에 쓰려 하면 바로 오류가 납니다. 공용 메일함 문의에는 근거를 붙인 답장 초안을 담당자 Gmail 초안함에 넣습니다. 보내는 일은 직원이 합니다.</p><ul><li>워크스페이스 이름이 어긋나면 서버가 뜨지 않습니다. 에이전트마다 이름을 달리 부르면 쓰기가 엉뚱한 저장소로 갈 수 있습니다. 정식 이름 13개는 Literal 타입으로 고정하고, 별칭 약 50개는 저장소 하나로 모읍니다. 모듈을 불러올 때 누락이나 저장소 불일치가 보이면 RuntimeError로 기동을 멈춥니다.</li><li>LLM 검색 계획은 검증을 통과해야 씁니다. 계획은 Pydantic으로 검사합니다. 실시간 DB 조회는 등록된 (프로젝트, 테이블) 조합만 허용하고, GET만 쓰며 최대 500행입니다. 호출·파싱·허용 목록 중 하나만 실패해도 규칙 라우터로 돌아갑니다. 이유는 fallback:&lt;예외명&gt;으로 남깁니다.</li><li>리랭크가 실패하면 두 단계 더 대신합니다. 문서를 20개로 자른 뒤 LLM 리랭커가 먼저 실행합니다. 실패하면 FlashRank, 그것도 실패하면 원래 순서에 점수를 매겨 결과는 늘 나옵니다. 검색 단계 동시 실행은 3으로 낮췄습니다. 그 덕에 병합 단계의 Neo4j 동시 쓰기가 문서당 8개에서 6개로 줄었습니다.</li><li>초안 검사기 13개가 오류 패턴을 하나씩 맡습니다. 요청 방향 반전, 없던 이전 메일 언급, 확정 조건 되묻기, 제안가를 확정가처럼 쓰기 같은 패턴입니다. 검사기마다 08-21~08-23 실제 메일 재현 사례를 넣었습니다. 처음엔 정규식이었는데 오탐이 이어져, 판정은 LLM 검사기로 옮겼습니다.</li><li>새 거짓말을 만든 수정은 받지 않습니다. 위반 점수 합만 비교하면 2점짜리 사실 위반이 10점짜리 금지어를 고친 대가로 통과합니다. 그래서 고쳐 쓴 초안에 없던 사실 위반이 새로 생기면, 다른 위반을 고쳤어도 그 수정을 버립니다. 고쳐도 남는 위반은 종류별로 &quot;Draft rejected&quot;를 남기고 폐기합니다.</li><li>근거 묶음은 한 번만 보냅니다. 주장 6개를 검증할 때마다 최대 15만 자짜리 근거 묶음을 다시 보내고 있었습니다. 묶음을 sha256 키로 5분 캐시해 다시 씁니다. 캐시가 실패하면 원래 방식으로 돌아가므로 판정 결과는 달라지지 않습니다.</li><li>보낸 메일 커서는 Gmail 지연까지 셈합니다. 배포 때 보낸 메일 1,943건 중 48건이 학습에서 빠졌습니다. 지금은 10분 단위로 읽고 단위마다 커서를 저장합니다. 검색 인덱스가 늦게 잡히니 커서는 현재보다 180초 뒤에 두고, 경계는 90초 겹쳐 읽습니다. 500건이 넘는 단위에서는 커서를 밀지 않습니다.</li><li>직원이 고친 사실은 서버가 범위를 정합니다. 고친 사실이 회사 전체 것인지 거래 하나의 것인지는 서버 규칙으로 판단합니다. 거래 하나의 사실을 파트너 전체로 넓히지 않습니다. 결과는 추가 전용 관찰 로그에만 쌓고, 초안과 검색에는 쓰지 않는 섀도 모드로 돌립니다.</li></ul><nav><ul><li><a href="/">목진희 · AI 엔지니어</a></li><li><a href="/about/">About Me</a></li><li><a href="/skills/">Skills</a></li><li><a href="/how-i-build/">How I Build with AI</a></li><li><a href="/projects/">Projects</a></li><li><a href="/projects/status-board/">현황판 · 운영 원장</a></li><li><a href="/projects/vendor-cs/">벤더
