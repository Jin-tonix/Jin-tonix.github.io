<!doctype html><html lang="ko"><head><script>!function(n){if("/"===n.search[1]){var a=n.search.slice(1).split("&").map((function(n){return n.replace(/~and~/g,"&")})).join("?");window.history.replaceState(null,null,n.pathname.slice(0,-1)+a+n.hash)}}(window.location)</script><meta charset="utf-8"/><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/><link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/><link rel="icon" href="/favicon.ico"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#222222"/><link rel="apple-touch-icon" href="/logo192.png"/><link rel="manifest" href="/manifest.json"/><link href="/static/css/main.284292b9.chunk.css" rel="stylesheet"><title>현황판 · Jinhee Mok</title><meta name="description" content="상대 한 곳을 고르면 카톡·메일·주문서가 한 달력에, 352곳의 거래 단계가 한 화면에 보입니다"/><meta property="og:type" content="article"/><meta property="og:site_name" content="Jinhee Mok · AI Engineer"/><meta property="og:url" content="https://jin-tonix.github.io/projects/status-board/"/><meta property="og:title" content="현황판 · Jinhee Mok"/><meta property="og:description" content="상대 한 곳을 고르면 카톡·메일·주문서가 한 달력에, 352곳의 거래 단계가 한 화면에 보입니다"/><meta property="og:image" content="https://jin-tonix.github.io/images/v3/diagram-status-board.png"/><meta property="og:locale" content="ko_KR"/><meta name="twitter:card" content="summary_large_image"/><link rel="canonical" href="https://jin-tonix.github.io/projects/status-board/"/><link rel="alternate" hreflang="ko" href="https://jin-tonix.github.io/projects/status-board/"/><link rel="alternate" hreflang="en" href="https://jin-tonix.github.io/en/projects/status-board/"/><link rel="alternate" hreflang="x-default" href="https://jin-tonix.github.io/projects/status-board/"/></head><body><noscript><main><h1>현황판 · 운영 원장</h1><p>상대 한 곳을 고르면 카톡·메일·주문서가 한 달력에, 352곳의 거래 단계가 한 화면에 보입니다</p><p>거래 상대와 나눈 이야기는 카톡방, order@ 메일, 슬랙에 나뉘어 있고 엑셀 주문서는 메일 첨부로 따로 옵니다. 현황판은 이 기록을 하루 단위로 요약해 상대별 달력에 날짜순으로 올립니다. 브랜드·벤더사·셀러 중 한 곳을 고르면 그 상대와 오간 기록이 한 화면에 모입니다. 소통현황 탭은 352곳이 첫 연락부터 정산까지 어느 단계에 있는지 보여 줍니다. 규칙으로 잇지 못한 기록과 애매한 단계는 직원이 정합니다.</p><ul><li>같은 기록이 다시 와도 화면은 그대로입니다. 수집기는 같은 기록을 몇 번이고 다시 보냅니다. (출처, source_ref)가 같으면 갱신하는 upsert 한 문장으로 저장합니다. 직원이 고친 행과 내용이 같은 행은 건드리지 않습니다. 내용이 같으면 트리거도 순번과 시각을 올리지 않아서, 재전송 뒤에도 화면이 그대로입니다.</li><li>작성자 값은 호출자가 보낸 것을 쓰지 않습니다. 인입 함수는 호출자가 보낸 작성자 값을 버리고 'ingest:출처'로 다시 만듭니다. manual 출처는 직원 전용이라 거절합니다. '직원이 고침' 표시는 앱이 아니라 트리거가 찍고, 숨긴 기록은 UPDATE로 되살릴 수 없습니다. 앱 역할에는 함수 실행 권한만 줍니다.</li><li>키가 엇갈리면 잇지 않습니다. 연결 순서는 스레드, 사업자번호, 카톡방, 이메일, 전화, 도메인, 거래처 코드, 별칭으로 고정했습니다. 사업자번호나 전화가 다른 근거와 다른 상대를 가리키면 충돌로 표시하고 미분류에 둡니다. gmail·naver 같은 공용 도메인 13개는 근거로 쓰지 않습니다.</li><li>동시 수집이 상대를 두 번 만들지 않습니다. 새 상대를 만들 때만 근거 값마다 advisory lock(트랜잭션 간 이름표 잠금)을 정렬 순서로 잡고 다시 찾습니다. 그 사이 다른 트랜잭션이 만든 상대가 있으면 그것을 씁니다. 직원의 단계 반영도 수집과 같은 잠금 순서(상대 → 제안)를 따라서 교착이 생기지 않습니다.</li><li>LLM 출력은 원문과 맞춰 봅니다. 단계 근거 문구는 마스킹된 본문의 부분 문자열일 때만 남깁니다. 거래 조건은 더 엄격합니다. 값에 든 숫자가 하나하나 인용문에 있어야 하고, 조건 종류별 키워드와 단위도 맞아야 합니다. 회사명은 근거 줄 안에 정규화한 이름이 있을 때만 씁니다.</li><li>주문서 표는 열 단위로 가립니다. 주문서는 대개 표로 옵니다. '수령인·주문자' 같은 머리 열을 찾고, 칸 수가 머리 줄과 같은 줄에서만 그 열의 값을 가립니다. 그래서 상품명과 수량은 요약에 남습니다. '㈜' 같은 법인 표기 옆 이름은 회사명으로 보고 가리지 않습니다.</li><li>비용은 부르기 전에 예약합니다. 잔액 검사와 예약이 SQL 한 문장이라 동시 호출 둘이 함께 한도를 넘지 못합니다. 예약액은 최대 입출력 기준 추정치와 바닥값(예약액 최소치) 중 큰 쪽입니다. 정산이 실패하면 그 뒤 호출을 멈춥니다. 늦게 온 재시도 요약은 날짜 비교에 걸려 새 요약을 덮지 못합니다.</li><li>메일 커서는 원장이 다 받은 뒤에 옮깁니다. 메일은 로컬 큐에 먼저 넣고 원장으로 보냅니다. Gmail history 커서는 그 회차 전달이 모두 성공해야 옮깁니다. 커서가 만료되면 마지막 성공 시각부터 목록으로 다시 채웁니다. 두 번 실패한 메일은 격리하고 경보를 냅니다.</li></ul><nav><ul><li><a href="/">목진희 · AI 엔지니어</a></li><li><a href="/about/">About Me</a></li><li><a href="/skills/">Skills</a></li><li><a href="/how-i-build/">How I Build with AI</a></li><li><a href="/projects/">Projects</a></li><li><a href="/projects/status-board/">현황판 · 운영 원장</a></li><li><a href="/projects/vendor-cs/">벤더 CS 에이전트</a></li><li><a href="/projects/ss-worktool/">사내 업무툴 · 가격·매칭·맞춤카톡</a></li><li><a href="/projects/email-agent/">LightRAG 지식 허브 · 메일 에이전트</a></li><li><a href="/projects/agent-platform/">에이전트 플랫폼 · Spark</a></li><li><a href="/projects/content-autopilot/">콘텐츠 오토파일럿</a></li><li><a href="/projects/field-fleet/">직원 PC 배포 · 운영</a></li></ul></nav></main></noscript><div id="root"></div><script>!function(e){function t(t){for(var n,u,a=t[0],c=t[1],l=t[2],s=0,p=[];s<a.length;s++)u=a[s],Object.prototype.hasOwnProperty.call(o,u)&&o[u]&&p.push(o[u][0]),o[u]=0;for(n in c)Object.prototype.hasOwnProperty.call(c,n)&&(e[n]=c[n]);for(f&&f(t);p.length;)p.shift()();return i.push.apply(i,l||[]),r()}function r(){for(var e,t=0;t<i.length;t++){for(var r=i[t],n=!0,a=1;a<r.length;a++){var c=r[a];0!==o[c]&&(n=!1)}n&&(i.splice(t--,1),e=u(u.s=r[0]))}return e}var n={},o={1:0},i=[];function u(t){if(n[t])return n[t].exports;var r=n[t]={i:t,l:!1,exports:{}};return e[t].call(r.exports,r,r.exports,u),r.l=!0,r.exports}u.e=function(e){var t=[],r=o[e];if(0!==r)if(r)t.push(r[2]);else{var n=new Promise((function(t,n){r=o[e]=[t,n]}));t.push(r[2]=n);var i,a=document.createElement("script");a.charset="utf-8",a.timeout=120,u.nc&&a.setAttribute("nonce",u.nc),a.src=function(e){return u.p+"static/js/"+({}[e]||e)+"."+{3:"842cb038"}[e]+".chunk.js"}(e);var c=new Error;i=function(t){a.onerror=a.onload=null,clearTimeout(l);var r=o[e];if(0!==r){if(r){var n=t&&("load"===t.type?"missing":t.type),i=t&&t.target&&t.target.src;c.message="Loading chunk "+e+" failed.\n("+n+": "+i+")",c.name="ChunkLoadError",c.type=n,c.request=i,r[1](c)}o[e]=void 0}};var l=setTimeout((function(){i({type:"timeout",target:a})}),12e4);a.onerror=a.onload=i,document.head.appendChild(a)}return Promise.all(t)},u.m=e,u.c=n,u.d=function(e,t,r){u.o(e,t)||Object.defineProperty(e,t,{enumerable:!0,get:r})},u.r=function(e){"undefined"!=typeof Symbol&&Symbol.toStringTag&&Object.defineProperty(e,Symbol.toStringTag,{value:"Module"}),Object.defineProperty(e,"__esModule",{value:!0})},u.t=function(e,t){if
