default" href="https://jin-tonix.github.io/projects/vendor-cs/"/></head><body><noscript><main><h1>Vendor CS Agent</h1><p>A KakaoTalk chatbot that answers only tagged questions, never hands off, and rewrites any number or brand that does not match the evidence</p><p>KakaoTalk has no official API, so a server alone cannot read or send counterpart conversations. Staff PCs collect the conversations and upload them to the server, and replies also go out from staff Macs. The server agent writes answers by searching per-counterpart records and the LightRAG knowledge hub (graph RAG over entities and relations, 13 workspaces). Since 2026-09-02 it no longer asks follow-up questions and answers only tagged questions, with no handoff. In exchange, it checks amounts, percentages, and brands against the evidence, and if they do not match it searches again and rewrites.</p><ul><li>A similar name does not decide the counterpart. The '(2670)' at the start of a room name is read as the ID. If the name part points better to a different vendor, at jamo similarity 0.80 or higher, it is treated as an ID typo and blocked. Without an ID, only a single name that is an exact match or a containment match is accepted. Sharing just a common suffix already scored 0.81–0.88, so I dropped fuzzy matching.</li><li>One message came in 51 times. kakaocli resends the latest message of an unread room every 2 seconds. When I counted, it was 51 times for 1 message, 170–200 per minute. A (room, message, unread count, sent by me) key drops resends within 15 seconds. Because the unread count is in the key, the signal from closing and reopening a room still gets through.</li><li>Numbers and brands are checked in code. Amounts and percentages in the draft are normalized ('3만원' is 30000원). Values not in the retrieved evidence, and words one character off from an evidence brand, are flagged as violations. If the LLM judgment fails or is ambiguous, it counts as no evidence. When a violation is found, it searches again with the reason attached and rewrites.</li><li>'Sent' is written only when it is true. If the send API was not called in that turn, completed-action sentences like '제안서 보내드렸습니다' (&quot;I've sent the proposal&quot;) are removed. When a retry arrives with the same idempotency key, it checks the actual queue state. Items in progress or already sent are not re-queued; only failed ones are retried. If the state is unknown, it returns an error instead of success.</li><li>Other counterparts' cases are masked. If a vendor name other than the current counterpart appears in search results, it is replaced with [다른 벤더], and the model is told that the replacement happened. All 11 Spark tools that query company-wide data are blocked in external rooms. The vendor name passed to the product recommendation lookup is set by the server, not the model.</li><li>Delivery is counted from the KakaoTalk DB. A baseline count is taken before sending. After sending, it counts how many text messages and photos were added in the local DB and resends only what is missing. Photos get an extra 60 seconds. In a 70-person room, the same photo arriving twice is worse than one photo missing. Completion is reported to the server only after this check.</li><li>The checkpoint moves only after 2xx. The Windows collector only reads KakaoTalk process memory with VM_READ access; it does no injection or hooking. The uploader moves the offset only after receiving 2xx. 422 and 413 are skipped; on 5xx or 429 it stops without committing and uploads again on the next run.</li><li>The processing path leaves its own liveness markers. It leaves one marker when a tagged message is accepted and one when it reaches a result. If no result marker appears past a business-hours threshold, the monitor catches it. The earlier approach, where the monitor guessed from outside that 'no draft means it stalled,' was removed in review. This path has 30 tests.</li><li>107 test files</li></ul><nav><ul><li><a href="/en/">Jinhee Mok · AI Engineer</a></li><li><a href="/en/about/">About Me</a></li><li><a href="/en/skills/">Skills</a></li><li><a href="/en/how-i-build/">How I Build with AI</a></li><li><a href="/en/projects/">Projects</a></li><li><a href="/en/projects/status-board/">Status Board · Operations Ledger</a></li><li><a href="/en/projects/vendor-cs/">Vendor CS Agent</a></li><li><a href="/en/projects/ss-worktool/">Internal Work Tool · Pricing, Matching, Personalized KakaoTalk</a></li><li><a href="/en/projects/email-agent/">LightRAG Knowledge Hub · Email Agent</a></li><li><a href="/en/projects/agent-platform/">Agent Platform · Spark</a></li><li><a href="/en/projects/content-autopilot/">Content Autopilot</a></li><li><a href="/en/projects/field-fleet/">Staff PC Deployment · Operations</a></li></ul></nav></main></noscript><div id="root"></div><script>!function(e){function t(t){for(var n,u,a=t[0],c=t[1],l=t[2],s=0,p=[];s<a.length;s++)u=a[s],Object.prototype.hasOwnProperty.call(o,u)&&o[u]&&p.push(o[u][0]),o[u]=0;for(n in c)Object.prototype.hasOwnProperty.call(c,n)&&(e[n]=c[n]);for(f&&f(t);p.length;)p.shift()();return i.push.apply(i,l||[]),r()}function r(){for(var e,t=0;t<i.length;t++){for(var r=i[t],n=!0,a=1;a<r.length;a++){var c=r[a];0!==o[c]&&(n=!1)}n&&(i.splice(t--,1),e=u(u.s=r[0]))}return e}var n={},o={1:0},i=[];function u(t){if(n[t])return n[t].exports;var r=n[t]={i:t,l:!1,exports:{}};return e[t].call(r.exports,r,r.exports,u),r.l=!0,r.exports}u.e=function(e){var t=[],r=o[e];if(0!==r)if(r)t.push(r[2]);else{var n=new Promise((function(t,n){r=o[e]=[t,n]}));t.push(r[2]=n);var i,a=document.createElement("script");a.charset="utf-8",a.timeout=120,u.nc&&a.setAttribute("nonce",u.nc),a.src=function(e){return u.p+"static/js/"+({}[e]||e)+"."+{3:"842cb038"}[e]+".chunk.js"}(e);var c=new Error;i=function(t){a.onerror=a.onload=null,clearTimeout(l);var r=o[e];if(0!==r){if(r){var n=t&&("load"===t.type?"missing":t.type),i=t&&t.target&&t.target.src;c.message="Loading chunk "+e+" failed.\n("+n+": "+i+")",c.na
