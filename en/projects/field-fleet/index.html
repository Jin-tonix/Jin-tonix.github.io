k rel="alternate" hreflang="x-default" href="https://jin-tonix.github.io/projects/field-fleet/"/></head><body><noscript><main><h1>Staff PC Deployment · Operations</h1><p>KakaoTalk and Instagram work has no official API, so I ship it to 11 staff PCs with a one-line install and run it there (as registered on 2026-09-16)</p><p>KakaoTalk and Instagram have no official API a server can call. So the work had to run on staff Macs and Windows PCs. Install is a one-line command, auth is a per-device key, and updates run on an automatic schedule per tool. I also run the servers myself. On 2026-08-20 a cloud DB quota stopped every work-tool API; I stood up the same API on a VM and restored service that day.</p><ul><li>An install token is consumed in a single UPDATE. If lookup and mark-as-used are separate, two PCs can register at once with one token. Registration passes only when an UPDATE conditioned on used_at IS NULL and expiry returns a row. Failure reasons are split into sentences staff can read. If one device is compromised, only its row is revoked.</li><li>zip hashes instead of version numbers. The sha256 of the published zip is the version. There is no separate version ledger, so the ledger and the file cannot drift apart. Workers swap only between jobs and simply exit. Restarting is the job of launchd and Task Scheduler. If a worker relaunched itself and two came up, the Instagram profile would break.</li><li>Update times differ per PC. If every device updates in the same minute, there is no window to pull a bad release. Mac real-time sync picks only a random minute within 14:00, and keeps that minute across reinstalls. The Windows CS tool downloads at a random time between 09:00 and 18:59, and tries once more 2 minutes after logon.</li><li>On Windows, KakaoTalk memory is only read. The KakaoTalk 26.8 update moved frida's (an app hooking tool) hook points, and the DB key could not be recovered either (measured on 2026-09-15). Messages were still in memory as plaintext JSON. The collector opens only PROCESS_VM_READ. With no injection, KakaoTalk does not crash and no admin rights are needed.</li><li>Send success is checked in the DB, not by exit code. On 2026-09-07 only the photo went out, the text was missing, and the job was still marked sent. Now it reads the local KakaoTalk DB right after sending and fills in only the missing part, once, on the spot. If the photo does not show up, it waits longer in case the upload is slow. Two copies of a photo in a 70-person room is worse than a lost message.</li><li>Device assignment and conditional claims are layered. On 2026-07-29 a dev Mac picked up the queue of a Mac reserved for remote work. Successes and failures alternated, and finding the cause took a day. Now a worker exits immediately if it is not the assigned host. A claim is a conditional UPDATE on status='pending', and the open-chat queue has UNIQUE(send_date, room_name) as a second guard.</li><li>Device blocks reach workers immediately via push. The push hub listens on Postgres LISTEN/NOTIFY and wakes workers over SSE. When device_keys changes, it re-authenticates before waking them. A blocked device gets revoked and its connection is closed. On the server side, filling the single revoked_at field is enough.</li><li>deploy.sh re-runs itself from the version in the commit being deployed. The 2026-09-28 deploy failure happened because the running script differed from the script in the commit. The image tag is set once as sha-&lt;commit&gt;, and if the pull fails it stops instead of falling back to :latest. compose is rendered before the build, so missing variables are caught before a 40-minute build.</li><li>11 staff PCs</li></ul><nav><ul><li><a href="/en/">Jinhee Mok · AI Engineer</a></li><li><a href="/en/about/">About Me</a></li><li><a href="/en/skills/">Skills</a></li><li><a href="/en/how-i-build/">How I Build with AI</a></li><li><a href="/en/projects/">Projects</a></li><li><a href="/en/projects/status-board/">Status Board · Operations Ledger</a></li><li><a href="/en/projects/vendor-cs/">Vendor CS Agent</a></li><li><a href="/en/projects/ss-worktool/">Internal Work Tool · Pricing, Matching, Personalized KakaoTalk</a></li><li><a href="/en/projects/email-agent/">LightRAG Knowledge Hub · Email Agent</a></li><li><a href="/en/projects/agent-platform/">Agent Platform · Spark</a></li><li><a href="/en/projects/content-autopilot/">Content Autopilot</a></li><li><a href="/en/projects/field-fleet/">Staff PC Deployment · Operations</a></li></ul></nav></main></noscript><div id="root"></div><script>!function(e){function t(t){for(var n,u,a=t[0],c=t[1],l=t[2],s=0,p=[];s<a.length;s++)u=a[s],Object.prototype.hasOwnProperty.call(o,u)&&o[u]&&p.push(o[u][0]),o[u]=0;for(n in c)Object.prototype.hasOwnProperty.call(c,n)&&(e[n]=c[n]);for(f&&f(t);p.length;)p.shift()();return i.push.apply(i,l||[]),r()}function r(){for(var e,t=0;t<i.length;t++){for(var r=i[t],n=!0,a=1;a<r.length;a++){var c=r[a];0!==o[c]&&(n=!1)}n&&(i.splice(t--,1),e=u(u.s=r[0]))}return e}var n={},o={1:0},i=[];function u(t){if(n[t])return n[t].exports;var r=n[t]={i:t,l:!1,exports:{}};return e[t].call(r.exports,r,r.exports,u),r.l=!0,r.exports}u.e=function(e){var t=[],r=o[e];if(0!==r)if(r)t.push(r[2]);else{var n=new Promise((function(t,n){r=o[e]=[t,n]}));t.push(r[2]=n);var i,a=document.createElement("script");a.charset="utf-8",a.timeout=120,u.nc&&a.setAttribute("nonce",u.nc),a.src=function(e){return u.p+"static/js/"+({}[e]||e)+"."+{3:"842cb038"}[e]+".chunk.js"}(e);var c=new Error;i=function(t){a.onerror=a.onload=null,clearTimeout(l);var r=o[e];if(0!==r){if(r){var n=t&&("load"===t.type?"missing":t.type),i=t&&t.target&&t.target.src;c.message="Loading chunk "+e+" failed.\n("+n+": "+i+")",c.name="ChunkLoadError",c.type=n,c.request=i,r[1](c)}o[e]=void 0}};var l=setTimeout((function(){i({type:"timeout",target:a})}),12e4);a.onerror=a.onload=i,document.head.appendChild(a)}return Promise.all(t)},u.m=e,u.c=n,u.d=function(e,t,r){u.o(e,t)||Object.defineProperty(e,
