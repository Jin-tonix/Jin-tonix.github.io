rnate" hreflang="x-default" href="https://jin-tonix.github.io/projects/status-board/"/></head><body><noscript><main><h1>Status Board · Operations Ledger</h1><p>Pick one counterpart and its KakaoTalk, email, and order sheets land on one calendar; the deal stage of all 352 counterparts fits on one screen</p><p>Conversations with counterparts are split across KakaoTalk rooms, the order@ mailbox, and Slack, and Excel order sheets arrive separately as email attachments. The Status Board summarizes these records per day and places them in date order on a per-counterpart calendar. Pick one brand, vendor, or seller, and every record exchanged with that counterpart comes together on one screen. The Communication Status tab shows where each of the 352 counterparts stands, from first contact to settlement. Records the rules could not match, and stages that are unclear, are decided by staff.</p><ul><li>The screen stays the same when the same record arrives again. Collectors resend the same record any number of times. It is stored with a single upsert statement that updates when (source, source_ref) matches. Rows edited by staff, and rows whose content is unchanged, are left alone. When content is unchanged the trigger does not bump the sequence number or timestamp either, so the screen stays the same after a resend.</li><li>The author value is never taken from the caller. The intake function drops the author value the caller sends and rebuilds it as 'ingest:source'. The manual source is staff-only, so it is rejected. The 'edited by staff' flag is set by a trigger, not the app, and hidden records cannot be restored with UPDATE. The app role gets only execute permission on functions.</li><li>When keys disagree, nothing is matched. The matching order is fixed: thread, business registration number, KakaoTalk room, email, phone, domain, account code, alias. If a business registration number or phone points to a different counterpart than the other evidence, it is flagged as a conflict and left in Unclassified. 13 public domains such as gmail and naver are not used as evidence.</li><li>Concurrent collection does not create a counterpart twice. Only when creating a new counterpart, an advisory lock (a named lock shared across transactions) is taken per evidence value in sorted order, then the lookup runs again. If another transaction created the counterpart in the meantime, that one is used. Staff stage updates follow the same lock order as collection (counterpart → proposal), so there are no deadlocks.</li><li>LLM output is checked against the original text. A stage evidence phrase is kept only if it is a substring of the masked body. Deal terms are stricter. Every number in the value must appear in the quote, and the keywords and units for that term type must match too. A company name is used only if its normalized name appears in the evidence line.</li><li>Order-sheet tables are masked by column. Order sheets usually arrive as tables. Header columns such as 'recipient·orderer' are located, and values in those columns are masked only on rows with the same cell count as the header row. Product names and quantities therefore stay in the summary. A name next to a corporate marker such as '㈜' is treated as a company name and not masked.</li><li>Cost is reserved before the call. The balance check and the reservation are one SQL statement, so two concurrent calls cannot both pass the limit. The reserved amount is the larger of an estimate based on maximum input/output and a floor (the minimum reservation). If settlement fails, later calls stop. A late retried summary fails the date comparison and cannot overwrite a newer summary.</li><li>The mail cursor moves only after the ledger has received everything. Emails go into a local queue first and are then sent to the ledger. The Gmail history cursor moves only when every delivery in that round succeeds. If the cursor expires, the gap is backfilled by listing from the last successful time. An email that fails twice is quarantined and raises an alert.</li><li>352 counterparts on the board</li></ul><nav><ul><li><a href="/en/">Jinhee Mok · AI Engineer</a></li><li><a href="/en/about/">About Me</a></li><li><a href="/en/skills/">Skills</a></li><li><a href="/en/how-i-build/">How I Build with AI</a></li><li><a href="/en/projects/">Projects</a></li><li><a href="/en/projects/status-board/">Status Board · Operations Ledger</a></li><li><a href="/en/projects/vendor-cs/">Vendor CS Agent</a></li><li><a href="/en/projects/ss-worktool/">Internal Work Tool · Pricing, Matching, Personalized KakaoTalk</a></li><li><a href="/en/projects/email-agent/">LightRAG Knowledge Hub · Email Agent</a></li><li><a href="/en/projects/agent-platform/">Agent Platform · Spark</a></li><li><a href="/en/projects/content-autopilot/">Content Autopilot</a></li><li><a href="/en/projects/field-fleet/">Staff PC Deployment · Operations</a></li></ul></nav></main></noscript><div id="root"></div><script>!function(e){function t(t){for(var n,u,a=t[0],c=t[1],l=t[2],s=0,p=[];s<a.length;s++)u=a[s],Object.prototype.hasOwnProperty.call(o,u)&&o[u]&&p.push(o[u][0]),o[u]=0;for(n in c)Object.prototype.hasOwnProperty.call(c,n)&&(e[n]=c[n]);for(f&&f(t);p.length;)p.shift()();return i.push.apply(i,l||[]),r()}function r(){for(var e,t=0;t<i.length;t++){for(var r=i[t],n=!0,a=1;a<r.length;a++){var c=r[a];0!==o[c]&&(n=!1)}n&&(i.splice(t--,1),e=u(u.s=r[0]))}return e}var n={},o={1:0},i=[];function u(t){if(n[t])return n[t].exports;var r=n[t]={i:t,l:!1,exports:{}};return e[t].call(r.exports,r,r.exports,u),r.l=!0,r.exports}u.e=function(e){var t=[],r=o[e];if(0!==r)if(r)t.push(r[2]);else{var n=new Promise((function(t,n){r=o[e]=[t,n]}));t.push(r[2]=n);var i,a=document.createElement("script");a.charset="utf-8",a.timeout=120,u.nc&&a.setAttribute("nonce",u.nc),a.src=function(e){return u.p+"static/js/"+({}[e]||e)+"."+{3:"842cb038"}[e]+".chunk.js"}(e);var c=new Error;i=function(t){a.onerror=a.onload=null,clearTimeout(l);var r=o[e];if(0!==r){if(r){
