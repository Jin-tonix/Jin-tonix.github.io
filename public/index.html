<!DOCTYPE html>
<html lang="ko">
  <head>
    <!-- GitHub Pages 는 서버 라우팅이 없어 딥링크(예: /about) 새로고침 시 404가 난다.
         public/404.html 이 쿼리스트링으로 리다이렉트한 경로를 여기서 원래 경로로 복원한다. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#222222" />
    <meta
      name="description"
      content="목진희 (Jinhee Mok) · AI 에이전트 엔지니어. StyleSeller 에서 제안서 가격 계산·거래처 카톡 문의·셀러 발굴을 사내 업무 웹과 에이전트로 옮기고, 설계부터 운영까지 혼자 맡았습니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jin-tonix.github.io/" />
    <meta property="og:title" content="목진희 · AI 에이전트 엔지니어" />
    <meta property="og:description" content="벤더 CS 에이전트, SS 업무툴(brand-tool), 메일 에이전트와 지식 허브, Spark · Work OS, 직원 PC 배포 · 운영 인프라." />
    <meta property="og:image" content="https://jin-tonix.github.io/images/hero-bg.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>목진희 · AI 에이전트 엔지니어</title>
  </head>
